# docker-compose.yml
version: '3.8'

services:
  # Serviço PHP-FPM (baseado no seu Dockerfile)
  app:
    build:
      context: . # Diretório onde está seu Dockerfile
      dockerfile: Dockerfile # Nome do seu Dockerfile
    container_name: laravel_app # Nome opcional para o container
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - ./:/var/www # Mapeia seu código para dentro do container
    networks:
      - laravelnet

  # Serviço Nginx (Servidor Web)
  nginx:
    image: nginx:alpine # Imagem leve do Nginx
    container_name: laravel_nginx # Nome opcional
    restart: unless-stopped
    ports:
      # Mapeia a porta 8080 do seu HOST para a porta 80 do container NGINX
      - "8080:80"
    volumes:
      - ./:/var/www # Nginx também precisa acessar os arquivos (pelo menos os estáticos)
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Mapeia sua configuração do Nginx
    depends_on:
      - app # Garante que o serviço 'app' inicie antes (ou junto)
    networks:
      - laravelnet

# Rede para comunicação entre os containers
networks:
  laravelnet:
    driver: bridge