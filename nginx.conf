# nginx.conf
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Raiz do seu projeto Laravel (pasta public)
    root /var/www/public;
    index index.php index.html index.htm;

    # Nome do servidor (ajuste se necessário, mas localhost funciona para dev)
    server_name _; # Aceita qualquer hostname

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass requests for .php files to PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # IMPORTANTE: 'app' deve ser o nome do serviço PHP no docker-compose.yml
        # A porta 9000 é a porta padrão do PHP-FPM
        fastcgi_pass app:9000;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300; # Aumente se tiver scripts longos
    }

    location ~ /\.ht {
        deny all;
    }
}